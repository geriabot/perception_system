# A depth camera like rgbd.yaml whose images are stamped with a body frame (x forward, y left, z
# up) instead of an optical frame: the Unitree R1 and the simulated Kobuki
perception_system:
  ros__parameters:
    projection:
      estimator: depth_image
      camera_info_topic: /rgbd_camera/camera_info
      depth_image_topic: /rgbd_camera/depth_image
      camera_frame_is_optical: false
