# Reproducible ROS 2 environments (RoboStack) to build and run perception_system without a
# system-wide ROS installation. See docs/INSTALLATION.md.
#
# The manifest lives in the repository (<workspace>/src/perception_system), but it is used from
# the root of the colcon workspace, through two links that pixi/setup_workspace.sh creates there
# (pixi.toml and pixi.lock): the environments (.pixi) live at the root of the workspace, and every
# path below is relative to it. From the root of the workspace:
#
#   pixi run build               # ROS 2 Jazzy (default environment): build/ and install/
#   pixi run test                # unit tests (no ROS graph needed)
#   pixi shell                   # shell with ROS 2 Jazzy and every dependency
#   pixi run -e lyrical build-lyrical   # ROS 2 Lyrical: build_lyrical/ and install_lyrical/

[workspace]
name = "perception_system"
channels = ["conda-forge"]
platforms = ["linux-64"]

[activation]
# Keep the fontconfig cache of this environment apart from the host one: pixi's fontconfig and
# the system's share ~/.cache/fontconfig with incompatible files, and the Qt applications of the
# environment (rviz2, rqt) may segfault at startup when they read the host's. See the script.
scripts = ["src/perception_system/pixi/activate-fontconfig.sh"]

[activation.env]
# The user's own Python packages (~/.local) must not mix with the environment's
PYTHONNOUSERSITE = "1"
PYTEST_DISABLE_PLUGIN_AUTOLOAD = "1"

[dependencies]
compilers = "*"
cmake = "*"
ninja = "*"
make = "*"
pkg-config = "*"
colcon-common-extensions = "*"
setuptools = "<80"  # >=80 breaks `setup.py develop` used by colcon --symlink-install
vcstool = "*"
numpy = "*"
pyyaml = "*"
pytest = "*"
yaml-cpp = "*"         # koch2
nlohmann_json = "*"    # koch2

[tasks.test]
description = "Unit tests of the packages that need no running ROS graph"
cmd = """bash -c 'source install/setup.bash && python -m pytest -q \
  src/perception_system/perception_detectors/test \
  src/perception_system/perception_system_core/perception_system/test \
  src/perception_system/perception_user/test \
  src/perception_system/perception_body/test \
  src/perception_system/perception_markers/test'"""

# ---------------------------------------------------------------------------
# ROS 2 distributions. Jazzy is the default; Lyrical builds into its own folders
# ---------------------------------------------------------------------------

[feature.jazzy]
channels = ["robostack-jazzy"]

[feature.jazzy.dependencies]
python = "3.12.*"
ros-jazzy-ros-base = "*"
ros-jazzy-vision-msgs = "*"
ros-jazzy-cv-bridge = "*"
ros-jazzy-tf2-ros = "*"
ros-jazzy-tf2-ros-py = "*"
ros-jazzy-behaviortree-cpp = "*"
ros-jazzy-launch-testing-ament-cmake = "*"
ros-jazzy-rviz2 = "*"
opencv = "<5"  # boxmot requires opencv-python<5

# The detection models and the tracker: the versions of the attention system, whose results
# were obtained with them; Ultralytics for YOLO, YOLO-World and the pose model of the body
# (AGPL-3.0); MediaPipe for the perception of the user (perception_user)
[feature.jazzy.pypi-dependencies]
torch = "==2.7.0"
torchvision = "==0.22.0"
transformers = "==4.56.2"
timm = "==1.0.20"
boxmot = "==16.0.11"
ultralytics = "==8.3.240"
mediapipe = "==0.10.35"

[feature.jazzy.tasks.build]
description = "Build perception_system and its dependencies (ROS 2 Jazzy)"
cmd = """colcon build --symlink-install \
  --packages-up-to perception_system perception_orchestrator perception_system_behaviors \
    perception_user \
  --cmake-args \
  -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
  -DPython3_EXECUTABLE=$CONDA_PREFIX/bin/python \
  -DBUILD_TESTING=OFF"""

[feature.lyrical]
channels = ["robostack-lyrical"]

# Lyrical builds and runs the ROS side (interfaces, nodes, behavior tree nodes, launch). Its
# OpenCV is 5, which boxmot 16 does not accept: the detection models and the tracker are installed
# in this environment by hand when needed (docs/INSTALLATION.md)
[feature.lyrical.dependencies]
opencv = "*"
ros-lyrical-ros-base = "*"
ros-lyrical-vision-msgs = "*"
ros-lyrical-cv-bridge = "*"
ros-lyrical-tf2-ros = "*"
ros-lyrical-tf2-ros-py = "*"
ros-lyrical-behaviortree-cpp = "*"

# Without the orchestrator: koch2 does not build on Lyrical yet, so on
# Lyrical the perception system runs with orchestrator:=false (docs/INSTALLATION.md)
[feature.lyrical.tasks.build-lyrical]
description = "Build perception_system (without the orchestrator) for ROS 2 Lyrical"
cmd = """colcon build --symlink-install --build-base build_lyrical --install-base install_lyrical \
  --packages-up-to perception_system perception_system_behaviors perception_user \
  --packages-ignore perception_orchestrator koch2 \
  --cmake-args \
  -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
  -DPython3_EXECUTABLE=$CONDA_PREFIX/bin/python \
  -DBUILD_TESTING=OFF"""

[environments]
default = ["jazzy"]
lyrical = ["lyrical"]

[pypi-options]
# MediaPipe needs opencv-contrib-python, which pip installs over the cv2 of conda: the same
# OpenCV 4.13 as conda's, not the latest (5), which ROS's cv_bridge and boxmot are not built for
dependency-overrides = { opencv-contrib-python = "==4.13.0.92" }
